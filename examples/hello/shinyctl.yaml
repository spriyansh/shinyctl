# A minimal example. Relative paths resolve from this file's directory, so
# shinyctl can be run from anywhere, e.g. from the repository root:
#
#   shinyctl apply -f examples/hello/shinyctl.yaml
#
# Then open http://127.0.0.1:8765

app-group: examples
app-name: hello
entrypoint-file: ./app.R
port: 8765
app-state-file: ./state.json
host: 127.0.0.1          # this machine only; 0.0.0.0 makes it reachable from the network
env:
  GREETING: Hello from shinyctl
