version: 2

builds:
  - id: shinyctl
    main: .
    binary: shinyctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/spriyansh/shinyctl/cmd.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "shinyctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  github:
    owner: spriyansh
    name: shinyctl
