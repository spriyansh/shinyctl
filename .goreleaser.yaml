version: 2

before:
  hooks:
    - go run ./tools/notices -o build/THIRD_PARTY_NOTICES

builds:
  - id: shinyctl
    main: .
    binary: shinyctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/spriyansh/shinyctl/cmd.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "shinyctl_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - src: build/THIRD_PARTY_NOTICES
        dst: THIRD_PARTY_NOTICES
      # named, not globbed: a state.json left in the example folder is not packed
      - examples/hello/app.R
      - examples/hello/shinyctl.yaml

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  github:
    owner: spriyansh
    name: shinyctl
